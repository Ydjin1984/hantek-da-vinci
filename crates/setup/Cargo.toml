[package]
name = "davinci-setup"
version = "0.2.5"
edition = "2021"
license = "MIT"
description = "Установщик «Осциллограф Хелтег да Винчи»"

# This crate is deliberately outside the main workspace: it embeds the release
# binary of `davinci`, so building it before `davinci` would bake in a stub and
# silently ship a broken installer. `tools/build-dist.ps1` builds them in order.
[workspace]

[[bin]]
name = "davinci-setup"
path = "src/main.rs"

[dependencies]

[build-dependencies]
# Same icon file as the program itself: the installer is the first thing a
# person sees, and a blank sheet in Explorer is not a good first impression.
tauri-winres = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
